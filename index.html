<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Web Player - YouTube & LRC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #000000;
            --bg-base: #121212;
            --bg-surface: #181818;
            --bg-highlight: #282828;
            --text-base: #ffffff;
            --text-subdued: #b3b3b3;
            --primary-green: #1ed760;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-base);
            height: 100vh;
            display: grid;
            grid-template-rows: 1fr 90px;
            overflow: hidden;
        }

        /* Layout Principal */
        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 8px;
            padding: 8px;
            height: calc(100vh - 90px);
        }

        /* Sidebar / Lista de canciones */
        .sidebar {
            background-color: var(--bg-base);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-header {
            color: var(--text-subdued);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .song-list {
            list-style: none;
            overflow-y: auto;
        }

        .song-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .song-item:hover {
            background-color: var(--bg-highlight);
        }

        .song-item.active {
            background-color: var(--bg-surface);
        }

        .song-item.active .song-item-name {
            color: var(--primary-green);
        }

        .song-item-img {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
        }

        .song-item-info {
            display: flex;
            flex-direction: column;
        }

        .song-item-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .song-item-artist {
            font-size: 0.8rem;
            color: var(--text-subdued);
        }

        /* Vista Principal: Letras estilo Spotify */
        .content-view {
            background-color: var(--bg-base);
            border-radius: 8px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .lyrics-wrapper {
            width: 100%;
            max-width: 650px;
            height: 70%;
            overflow-y: auto;
            text-align: center;
            scroll-behavior: smooth;
            padding: 40px 0;
        }

        /* Ocultar barra de scroll en letras */
        .lyrics-wrapper::-webkit-scrollbar {
            display: none;
        }

        .lyric-line {
            font-size: 1.6rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            margin: 18px 0;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .lyric-line.active {
            color: var(--text-base);
            transform: scale(1.05);
        }

        /* Barra Inferior del Reproductor */
        .player-bar {
            background-color: var(--bg-black);
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            padding: 0 16px;
        }

        /* Track Info (Izquierda) */
        .current-track {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .current-track-img {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            object-fit: cover;
        }

        .current-track-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .current-track-artist {
            font-size: 0.75rem;
            color: var(--text-subdued);
        }

        /* Controles (Centro) */
        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-subdued);
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-control:hover {
            color: var(--text-base);
        }

        .btn-play {
            background-color: var(--text-base);
            color: var(--bg-black);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: transform 0.1s ease;
        }

        .btn-play:hover {
            transform: scale(1.06);
            color: var(--bg-black);
            background-color: var(--text-base);
        }

        .playback-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-subdued);
        }

        .progress-slider {
            flex: 1;
            height: 4px;
            appearance: none;
            background: #4d4d4d;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .progress-slider::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-base);
            display: none;
        }

        .progress-slider:hover::-webkit-slider-thumb {
            display: block;
        }

        /* IFrame oculto de YouTube */
        #youtube-player-container {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-list"></i> Tu Biblioteca
            </div>
            <ul class="song-list" id="playlist"></ul>
        </aside>

        <!-- Contenido principal: Letras estilo Spotify -->
        <main class="content-view">
            <div class="lyrics-wrapper" id="lyrics-container">
                <p class="lyric-line active">Selecciona una canción para comenzar</p>
            </div>
        </main>
    </div>

    <!-- Barra del reproductor inferior -->
    <footer class="player-bar">
        <div class="current-track">
            <img id="current-cover" class="current-track-img" src="https://via.placeholder.com/56" alt="Cover">
            <div>
                <div id="current-title" class="current-track-name">--</div>
                <div id="current-artist" class="current-track-artist">--</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button class="btn-control" id="prev-btn"><i class="fas fa-step-backward"></i></button>
                <button class="btn-control btn-play" id="play-btn"><i class="fas fa-play" id="play-icon"></i></button>
                <button class="btn-control" id="next-btn"><i class="fas fa-step-forward"></i></button>
            </div>
            <div class="playback-bar">
                <span id="current-time">0:00</span>
                <input type="range" class="progress-slider" id="progress-bar" value="0" min="0" max="100" step="0.1">
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <div></div>
    </footer>

    <!-- Contenedor del IFrame de YouTube API -->
    <div id="youtube-player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Carga del SDK IFrame de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // --- Estructura de Datos ---
        // youtubeId: El ID del video (extraído de https://www.youtube.com/watch?v=ID_AQUI)
        // rawLyrics: Cadena formato .lrc directamente integrada para evitar bloqueos CORS locales
        const songs = [
            {
                name: "Una Mujer Como Tú",
                artist: "Eddie Santiago",
                youtubeId: "8Z0Z5XjG2yU", // ID de ejemplo de YouTube
                coverImage: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150",
                rawLyrics: `[00:00.00] Eddie Santiago - Una Mujer Como Tú
[00:05.00] (Intro Musical)
[00:15.00] Busco una mujer como tú
[00:20.00] Que me entregue su amor sin medida
[00:27.00] Que llene de luz mi vida
[00:32.00] Una mujer como tú...`
            }
        ];

        let ytPlayer;
        let currentSongIndex = 0;
        let parsedLyrics = [];
        let isPlaying = false;
        let timerInterval;

        // Se ejecuta automáticamente cuando la API de YouTube carga
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                videoId: songs[currentSongIndex].youtubeId,
                playerVars: {
                    'playsinline': 1,
                    'controls': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            renderPlaylist();
            loadSong(currentSongIndex, false);
        }

        function onPlayerStateChange(event) {
            // 1 = Reproduciendo, 2 = Pausado, 0 = Finalizado
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                updatePlayButton();
                startProgressLoop();
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
                updatePlayButton();
                stopProgressLoop();
                if (event.data === YT.PlayerState.ENDED) {
                    nextSong();
                }
            }
        }

        // Cargar canción actual
        function loadSong(index, autoPlay = true) {
            currentSongIndex = index;
            const song = songs[currentSongIndex];

            document.getElementById('current-title').textContent = song.name;
            document.getElementById('current-artist').textContent = song.artist;
            document.getElementById('current-cover').src = song.coverImage;

            parseLRC(song.rawLyrics);
            updatePlaylistSelection();

            if (ytPlayer && ytPlayer.loadVideoById) {
                if (autoPlay) {
                    ytPlayer.loadVideoById(song.youtubeId);
                } else {
                    ytPlayer.cueVideoById(song.youtubeId);
                }
            }
        }

        // Renderizar Lista
        function renderPlaylist() {
            const playlistEl = document.getElementById('playlist');
            playlistEl.innerHTML = '';

            songs.forEach((song, i) => {
                const li = document.createElement('li');
                li.className = `song-item ${i === currentSongIndex ? 'active' : ''}`;
                li.onclick = () => loadSong(i, true);

                li.innerHTML = `
                    <img src="${song.coverImage}" class="song-item-img">
                    <div class="song-item-info">
                        <span class="song-item-name">${song.name}</span>
                        <span class="song-item-artist">${song.artist}</span>
                    </div>
                `;
                playlistEl.appendChild(li);
            });
        }

        function updatePlaylistSelection() {
            const items = document.querySelectorAll('.song-item');
            items.forEach((item, index) => {
                item.classList.toggle('active', index === currentSongIndex);
            });
        }

        // Procesador de formato .lrc
        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const timeRegex = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/;
            const container = document.getElementById('lyrics-container');
            
            parsedLyrics = [];
            container.innerHTML = '';

            lines.forEach(line => {
                const match = timeRegex.exec(line);
                if (match) {
                    const min = parseInt(match[1]);
                    const sec = parseFloat(match[2]);
                    const text = match[3].trim();

                    if (text !== '') {
                        const totalSec = (min * 60) + sec;
                        parsedLyrics.push({ time: totalSec, text: text });

                        const p = document.createElement('p');
                        p.className = 'lyric-line';
                        p.textContent = text;
                        container.appendChild(p);
                    }
                }
            });
        }

        // Sincronización de Letras y Tiempo
        function startProgressLoop() {
            stopProgressLoop();
            timerInterval = setInterval(() => {
                if (!ytPlayer || !ytPlayer.getCurrentTime) return;

                const current = ytPlayer.getCurrentTime();
                const total = ytPlayer.getDuration();

                document.getElementById('current-time').textContent = formatTime(current);
                document.getElementById('total-duration').textContent = formatTime(total);
                
                const progressBar = document.getElementById('progress-bar');
                progressBar.max = total || 100;
                progressBar.value = current;

                syncLyrics(current);
            }, 250);
        }

        function stopProgressLoop() {
            clearInterval(timerInterval);
        }

        function syncLyrics(currentTime) {
            if (parsedLyrics.length === 0) return;

            let activeIndex = -1;
            for (let i = 0; i < parsedLyrics.length; i++) {
                if (currentTime >= parsedLyrics[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            const lines = document.querySelectorAll('.lyric-line');
            lines.forEach((line, i) => {
                if (i === activeIndex) {
                    if (!line.classList.contains('active')) {
                        line.classList.add('active');
                        line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else {
                    line.classList.remove('active');
                }
            });
        }

        // Controles de Reproducción
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');

        playBtn.addEventListener('click', () => {
            if (!ytPlayer) return;
            if (isPlaying) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        });

        function updatePlayButton() {
            if (isPlaying) {
                playIcon.className = 'fas fa-pause';
            } else {
                playIcon.className = 'fas fa-play';
            }
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            loadSong(currentSongIndex, true);
        });

        document.getElementById('next-btn').addEventListener('click', nextSong);

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            loadSong(currentSongIndex, true);
        }

        document.getElementById('progress-bar').addEventListener('input', (e) => {
            if (ytPlayer && ytPlayer.seekTo) {
                ytPlayer.seekTo(e.target.value, true);
            }
        });

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
