<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Web Player - Réplica</title>
  <!-- Iconos de Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: #121212;
      --bg-highlight: #1a1a1a;
      --bg-elevated: #242424;
      --text-base: #ffffff;
      --text-subdued: #b3b3b3;
      --accent: #1ed760;
      --accent-hover: #1fdf64;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-base);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Layout principal */
    .app-container {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 8px;
      padding: 8px;
      height: calc(100vh - 90px);
    }

    /* Sidebar */
    .sidebar {
      background-color: var(--bg-surface);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-subdued);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-base);
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-subdued);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .song-list-sidebar {
      overflow-y: auto;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .sidebar-song-item:hover {
      background-color: var(--bg-highlight);
    }

    .sidebar-song-item img {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
    }

    .song-info-mini h4 {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-base);
    }

    .song-info-mini p {
      font-size: 0.8rem;
      color: var(--text-subdued);
    }

    /* Main View */
    .main-content {
      background: linear-gradient(180deg, #2a2a2a 0%, var(--bg-surface) 300px);
      border-radius: 8px;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .hero-section {
      display: flex;
      align-items: flex-end;
      gap: 24px;
    }

    .hero-cover {
      width: 220px;
      height: 220px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      object-fit: cover;
    }

    .hero-details h1 {
      font-size: 4rem;
      font-weight: 900;
      margin: 8px 0;
      line-height: 1;
    }

    .hero-details p {
      color: var(--text-subdued);
      font-size: 0.9rem;
    }

    /* Tablas / Listas de canciones */
    .tracks-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .tracks-table th {
      color: var(--text-subdued);
      font-weight: 400;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
    }

    .track-row {
      transition: background 0.2s;
      border-radius: 4px;
      cursor: pointer;
    }

    .track-row:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .track-row.active {
      color: var(--accent);
    }

    .track-row td {
      padding: 12px 16px;
      vertical-align: middle;
      font-size: 0.9rem;
    }

    .track-title-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .track-title-cell img {
      width: 40px;
      height: 40px;
      border-radius: 4px;
    }

    /* Reproductor inferior */
    .player-bar {
      height: 90px;
      background-color: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 30%;
    }

    .now-playing img {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      object-fit: cover;
    }

    .now-playing-details h4 {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .now-playing-details p {
      font-size: 0.75rem;
      color: var(--text-subdued);
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 40%;
      max-width: 720px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-subdued);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, transform 0.1s;
    }

    .btn-icon:hover {
      color: var(--text-base);
    }

    .btn-play {
      width: 36px;
      height: 36px;
      background-color: var(--text-base);
      color: var(--bg-base);
      border-radius: 50%;
    }

    .btn-play:hover {
      transform: scale(1.05);
      background-color: var(--accent-hover);
      color: var(--bg-base);
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .time-text {
      font-size: 0.75rem;
      color: var(--text-subdued);
      min-width: 35px;
    }

    .slider {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #4d4d4d;
      outline: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-base);
      cursor: pointer;
      display: none;
    }

    .slider:hover::-webkit-slider-thumb {
      display: block;
    }

    .volume-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      width: 30%;
    }

    .volume-slider {
      width: 100px;
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
      .hero-section {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .hero-details h1 {
        font-size: 2rem;
      }
      .now-playing {
        width: 50%;
      }
      .volume-controls {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Lateral izquierda -->
    <aside class="sidebar">
      <ul class="nav-list">
        <li><a href="#" class="nav-item active"><i data-lucide="home"></i> Inicio</a></li>
        <li><a href="#" class="nav-item"><i data-lucide="search"></i> Buscar</a></li>
      </ul>

      <div class="library-header">
        <div class="nav-item"><i data-lucide="library"></i> Tu biblioteca</div>
        <button class="btn-icon"><i data-lucide="plus"></i></button>
      </div>

      <div class="song-list-sidebar" id="sidebarList">
        <!-- Generado dinámicamente -->
      </div>
    </aside>

    <!-- Área Principal -->
    <main class="main-content">
      <section class="hero-section">
        <img id="currentCover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&q=80" alt="Cover" class="hero-cover">
        <div class="hero-details">
          <p>PLAYLIST</p>
          <h1 id="currentTitleDisplay">Lo Mejor del Pop</h1>
          <p id="currentArtistDisplay">Selección de éxitos para concentrarte y disfrutar.</p>
        </div>
      </section>

      <section>
        <table class="tracks-table">
          <thead>
            <tr>
              <th style="width: 40px;">#</th>
              <th>Título</th>
              <th>Álbum</th>
              <th style="width: 80px;"><i data-lucide="clock"></i></th>
            </tr>
          </thead>
          <tbody id="tracklistBody">
            <!-- Canciones inyectadas con JS -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Barra de reproducción inferior -->
  <footer class="player-bar">
    <div class="now-playing">
      <img id="playerCover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&q=80" alt="Cover">
      <div class="now-playing-details">
        <h4 id="playerTitle">Selecciona una canción</h4>
        <p id="playerArtist">-</p>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button class="btn-icon" id="btnShuffle"><i data-lucide="shuffle"></i></button>
        <button class="btn-icon" id="btnPrev"><i data-lucide="skip-back"></i></button>
        <button class="btn-icon btn-play" id="btnPlay"><i data-lucide="play" id="playIcon"></i></button>
        <button class="btn-icon" id="btnNext"><i data-lucide="skip-forward"></i></button>
        <button class="btn-icon" id="btnRepeat"><i data-lucide="repeat"></i></button>
      </div>
      <div class="progress-container">
        <span class="time-text" id="currentTime">0:00</span>
        <input type="range" class="slider" id="progressBar" value="0" min="0" max="100">
        <span class="time-text" id="durationTime">0:00</span>
      </div>
    </div>

    <div class="volume-controls">
      <button class="btn-icon"><i data-lucide="volume-2"></i></button>
      <input type="range" class="slider volume-slider" id="volumeBar" value="80" min="0" max="100">
    </div>
  </footer>

  <!-- Elemento HTML5 de audio invisible -->
  <audio id="audioPlayer"></audio>

  <script>
    // Lista de canciones de muestra (música libre de derechos de autor)
    const songs = [
      {
        id: 0,
        title: "Lofi Study Beats",
        artist: "Chill Master",
        album: "Relaxation Vol. 1",
        duration: "2:20",
        cover: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=400&q=80",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      },
      {
        id: 1,
        title: "Synthwave Sunset",
        artist: "Neon Driver",
        album: "Retro Nights",
        duration: "7:05",
        cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&q=80",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
      },
      {
        id: 2,
        title: "Acoustic Morning",
        artist: "Sarah Jenkins",
        album: "Coffee & Guitar",
        duration: "5:44",
        cover: "https://images.unsplash.com/photo-1445985543470-41fba5c3144a?w=400&q=80",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
      }
    ];

    let currentSongIndex = 0;
    let isPlaying = false;

    // Elementos del DOM
    const audio = document.getElementById('audioPlayer');
    const btnPlay = document.getElementById('btnPlay');
    const playIcon = document.getElementById('playIcon');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const progressBar = document.getElementById('progressBar');
    const volumeBar = document.getElementById('volumeBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');

    // Inicializar app
    function initApp() {
      renderTracklist();
      renderSidebar();
      loadSong(songs[0]);
      lucide.createIcons();
    }

    // Cargar información de la canción
    function loadSong(song) {
      audio.src = song.src;
      document.getElementById('playerTitle').textContent = song.title;
      document.getElementById('playerArtist').textContent = song.artist;
      document.getElementById('playerCover').src = song.cover;
      document.getElementById('currentCover').src = song.cover;
      document.getElementById('currentTitleDisplay').textContent = song.title;
      document.getElementById('currentArtistDisplay').textContent = `${song.artist} • ${song.album}`;
      
      updateActiveRow();
    }

    // Renderizar la lista de reproducción
    function renderTracklist() {
      const tbody = document.getElementById('tracklistBody');
      tbody.innerHTML = songs.map((song, index) => `
        <tr class="track-row ${index === currentSongIndex ? 'active' : ''}" onclick="selectAndPlay(${index})">
          <td>${index + 1}</td>
          <td>
            <div class="track-title-cell">
              <img src="${song.cover}" alt="${song.title}">
              <div>
                <div style="font-weight: 500;">${song.title}</div>
                <div style="color: var(--text-subdued); font-size: 0.8rem;">${song.artist}</div>
              </div>
            </div>
          </td>
          <td style="color: var(--text-subdued);">${song.album}</td>
          <td style="color: var(--text-subdued);">${song.duration}</td>
        </tr>
      `).join('');
    }

    // Renderizar biblioteca en el Sidebar
    function renderSidebar() {
      const sidebarList = document.getElementById('sidebarList');
      sidebarList.innerHTML = songs.map((song, index) => `
        <div class="sidebar-song-item" onclick="selectAndPlay(${index})">
          <img src="${song.cover}" alt="${song.title}">
          <div class="song-info-mini">
            <h4>${song.title}</h4>
            <p>Canción • ${song.artist}</p>
          </div>
        </div>
      `).join('');
    }

    function updateActiveRow() {
      document.querySelectorAll('.track-row').forEach((row, i) => {
        if (i === currentSongIndex) {
          row.classList.add('active');
        } else {
          row.classList.remove('active');
        }
      });
    }

    // Control Play / Pause
    function togglePlay() {
      if (isPlaying) {
        audio.pause();
      } else {
        audio.play();
      }
      isPlaying = !isPlaying;
      updatePlayButton();
    }

    function updatePlayButton() {
      if (isPlaying) {
        playIcon.setAttribute('data-lucide', 'pause');
      } else {
        playIcon.setAttribute('data-lucide', 'play');
      }
      lucide.createIcons();
    }

    function selectAndPlay(index) {
      currentSongIndex = index;
      loadSong(songs[currentSongIndex]);
      isPlaying = true;
      audio.play();
      updatePlayButton();
    }

    // Formatear segundos a 0:00
    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Eventos de Audio
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        progressBar.value = progressPercent;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationTimeEl.textContent = formatTime(audio.duration);
      }
    });

    progressBar.addEventListener('input', () => {
      const seekTime = (progressBar.value / 100) * audio.duration;
      audio.currentTime = seekTime;
    });

    volumeBar.addEventListener('input', () => {
      audio.volume = volumeBar.value / 100;
    });

    btnPlay.addEventListener('click', togglePlay);

    btnNext.addEventListener('click', () => {
      currentSongIndex = (currentSongIndex + 1) % songs.length;
      selectAndPlay(currentSongIndex);
    });

    btnPrev.addEventListener('click', () => {
      currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
      selectAndPlay(currentSongIndex);
    });

    // Iniciar la aplicación al cargar
    window.onload = initApp;
  </script>
</body>
</html>
